/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Variants */
    // List debuggable variants for all flavors
    debuggableVariants = ["aadhithyaDebug", "aaimathajiDebug", "alphacbseDebug", "alphamatDebug", "alphatechnoDebug", "avlDebug", "balakrishnaDebug", "bsschoolDebug", "carmelnpDebug", "crescentDebug", "csistthomasDebug", "doonDebug", "gloryDebug", "greenworldschoolDebug", "holyangelsDebug", "holycresentmatricDebug", "holycresentnazDebug", "holycresentsriDebug", "holycresentthiruDebug", "infantDebug", "islamiahDebug", "joshuaDebug", "kalaimagalDebug", "kamalanehruDebug", "littleflowerDebug", "measiDebug", "mountcarmelDebug", "mountsenoDebug", "nationallotusDebug", "ourladyexcelDebug", "ourladynpDebug", "periyarDebug", "psseniorDebug", "railwaybalabhavanDebug", "rpccbseDebug", "rukmaniDebug", "sivakasiDebug", "stdominicsDebug", "stjosephkoduDebug", "stmosesDebug", "templegreenDebug", "templeparkDebug", "udhayamglobalDebug", "venkateshwaraDebug", "vidyaratnaDebug", "vipschoolDebug", "vnrvivekanandaDebug", "vsnmatricDebug"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.schooltree.parentapp"

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 9
        versionName "1.0.3"

        // react-native-config resolves BuildConfig via <applicationId>.BuildConfig by default,
        // but each flavor overrides applicationId while BuildConfig stays in the namespace above.
        // Without this every Config.* value is undefined (e.g. API_BASE_URL override is ignored).
        resValue "string", "build_config_package", "com.schooltree.parentapp"

        // Default BuildConfig fields (overridden by flavors)
        buildConfigField "String", "BRAND_ID", "\"crescent\""
        buildConfigField "String", "AUTH_TYPE", "\"password\""
        buildConfigField "String", "DB_NAME", "\"crescent_db\""
    }

